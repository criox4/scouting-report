# nginx site for hosts that already run nginx + certbot (e.g. zd-instance).
# Install: copy to /etc/nginx/sites-available/scout, link into sites-enabled, then
#   certbot --nginx -d scout.172-104-171-139.nip.io
server {
    listen 80;
    listen [::]:80;
    server_name scout.172-104-171-139.nip.io;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # stream report progress lines as they happen
        proxy_read_timeout 300s;      # first reports on busy wallets can take a while
    }
}
